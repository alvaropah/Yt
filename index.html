<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transferir Suscripciones de YouTube</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #121212;
      color: #e0e0e0;
    }
    h2 { color: #ff4e45; }
    .card {
      background: #1e1e1e;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid #333;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #444;
      box-sizing: border-box;
      font-size: 15px;
    }
    input { background: #2c2c2c; color: #fff; }
    button {
      background: #ff0000;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
    }
    #log {
      background: #000;
      color: #00ff66;
      padding: 12px;
      height: 280px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      border-radius: 8px;
      white-space: pre-wrap;
      border: 1px solid #333;
    }
  </style>
</head>
<body>

  <h2>Transferir Suscripciones YT (Ahorro de Cuota)</h2>

  <div class="card">
    <label><strong>Paso 1: Tu Client ID de Google Cloud</strong></label>
    <input type="text" id="clientId" placeholder="123456789-abc...apps.googleusercontent.com">
  </div>

  <div class="card">
    <label><strong>Paso 2: Cuenta de Origen</strong></label>
    <button id="btnSource" onclick="extractSubs()">1. Conectar Origen y Extraer</button>
    <p id="statusSource" style="margin: 8px 0 0; font-size: 14px; color: #aaa;">Sin extraer aún.</p>
  </div>

  <div class="card">
    <label><strong>Paso 3: Cuenta de Destino</strong></label>
    <button id="btnDest" onclick="transferSubs()" disabled>2. Conectar Destino y Transferir (Filtrando duplicados)</button>
  </div>

  <div id="log">Esperando acciones...\n</div>

  <script>
    let subsList = [];
    let tokenClient;

    function log(msg) {
      const logBox = document.getElementById('log');
      logBox.textContent += msg + '\n';
      logBox.scrollTop = logBox.scrollHeight;
    }

    function getClientId() {
      const id = document.getElementById('clientId').value.trim();
      if (!id) {
        alert('Por favor, pega tu Client ID primero en el Paso 1.');
        return null;
      }
      return id;
    }

    // Función genérica para leer todas las suscripciones de cualquier cuenta (gasta solo 1 unidad por cada 50 canales)
    async function getAccountSubscriptions(token, label) {
      let list = [];
      let pageToken = '';
      do {
        const url = `https://www.googleapis.com/youtube/v3/subscriptions?part=snippet&mine=true&maxResults=50${pageToken ? '&pageToken=' + pageToken : ''}`;
        const res = await fetch(url, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        for (const item of data.items || []) {
          list.push({
            id: item.snippet.resourceId.channelId,
            title: item.snippet.title
          });
        }
        pageToken = data.nextPageToken || '';
        log(`📥 [${label}] Leídas ${list.length} suscripciones...`);
      } while (pageToken);
      return list;
    }

    function extractSubs() {
      const clientId = getClientId();
      if (!clientId) return;

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/youtube.readonly',
        prompt: 'select_account',
        callback: async (resp) => {
          if (resp.error) {
            log('❌ Error de autenticación: ' + resp.error);
            return;
          }
          log('🔑 Cuenta origen conectada. Extrayendo suscripciones...');
          try {
            subsList = await getAccountSubscriptions(resp.access_token, 'Origen');
            log(`✅ ¡Extracción completada! Total en origen: ${subsList.length} canales.`);
            document.getElementById('statusSource').textContent = `${subsList.length} canales listos para comparar y transferir.`;
            document.getElementById('btnDest').disabled = false;
          } catch (err) {
            log('❌ Error al extraer: ' + err.message);
          }
        }
      });
      tokenClient.requestAccessToken();
    }

    function transferSubs() {
      const clientId = getClientId();
      if (!clientId) return;

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/youtube',
        prompt: 'select_account',
        callback: async (resp) => {
          if (resp.error) {
            log('❌ Error de autenticación: ' + resp.error);
            return;
          }
          log('🔑 Cuenta destino conectada. Comprobando canales ya suscritos para ahorrar cuota...');
          await filterAndInsertSubs(resp.access_token);
        }
      });
      tokenClient.requestAccessToken();
    }

    async function filterAndInsertSubs(token) {
      document.getElementById('btnDest').disabled = true;

      try {
        // 1. Leemos primero los canales que YA tiene la cuenta de destino
        const existingSubs = await getAccountSubscriptions(token, 'Destino');
        const existingIds = new Set(existingSubs.map(sub => sub.id));

        // 2. Filtramos para quedarnos SOLO con los que no están en la cuenta destino
        const pendingSubs = subsList.filter(sub => !existingIds.has(sub.id));
        const skippedCount = subsList.length - pendingSubs.length;

        log(`🔍 Comprobación lista: Ya estás suscrito a ${skippedCount} de estos canales (ahorradas ${skippedCount * 50} unidades de cuota).`);
        log(`🚀 Faltan por suscribir: ${pendingSubs.length} canales.`);

        if (pendingSubs.length === 0) {
          log('🎉 ¡Ya estás suscrito a todos los canales! No hace falta transferir nada.');
          document.getElementById('btnDest').disabled = false;
          return;
        }

        // 3. Nos suscribimos únicamente a los canales pendientes
        let ok = 0;
        for (let i = 0; i < pendingSubs.length; i++) {
          const sub = pendingSubs[i];
          try {
            const res = await fetch('https://www.googleapis.com/youtube/v3/subscriptions?part=snippet', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                snippet: {
                  resourceId: {
                    kind: 'youtube#channel',
                    channelId: sub.id
                  }
                }
              })
            });
            const data = await res.json();

            if (data.error) {
              log(`[${i+1}/${pendingSubs.length}] ⚠️ Error en ${sub.title}: ${data.error.message}`);
              if (data.error.message.includes('quotaExceeded')) {
                log('🛑 Límite diario alcanzado (~200 canales/día). Mañana podrás continuar exactamente desde aquí sin gastar cuota en los ya hechos.');
                break;
              }
            } else {
              ok++;
              log(`[${i+1}/${pendingSubs.length}] ✅ Suscrito a: ${sub.title}`);
            }
          } catch (err) {
            log(`[${i+1}/${pendingSubs.length}] ❌ Fallo de red en ${sub.title}`);
          }
          await new Promise(r => setTimeout(r, 1200));
        }

        log(`🎉 Proceso finalizado. Nuevas suscripciones añadidas hoy: ${ok}`);
      } catch (err) {
        log('❌ Error comprobando cuenta de destino: ' + err.message);
      }

      document.getElementById('btnDest').disabled = false;
    }
  </script>
</body>
</html>
